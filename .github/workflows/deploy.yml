name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs an OIDC token to talk to Pages; nothing needs write
# access to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway — let a run finish before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      # Pages serves 404.html for any unknown path. Handing it the app shell
      # turns a refreshed deep link into a normal load instead of a 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # `enablement` creates the Pages site on the first run if it does not
      # exist yet, so a fresh clone of this repo deploys without anyone having
      # to visit Settings first. It is a no-op once Pages is on.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
