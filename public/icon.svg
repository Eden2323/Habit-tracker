<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="75 Hard Tracker">
  <title>75 Hard Tracker</title>
  <!--
    A 75%-filled progress ring around a hand-drawn "75". The numerals are
    stroked paths rather than text so the mark renders identically everywhere,
    with no font to load. scripts/generate-icons.mjs rasterises this same
    geometry to PNG.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1c1a"/>
      <stop offset="1" stop-color="#0e0e0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4703f"/>
      <stop offset="1" stop-color="#e0562a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ground)"/>

  <!-- Track, then the 75% sweep clockwise from twelve o'clock. -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#302f2c" stroke-width="30"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#accent)" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="838.8 1118.4" transform="rotate(-90 256 256)"/>

  <!-- Numerals drawn in their own 0,0-based space, then centred in the ring. -->
  <g fill="none" stroke="#f2f0ec" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(256 256) scale(0.9) translate(-116 -78)">
    <path d="M6 8H90L44 148"/>
    <path d="M226 8H146L142 66C166 54 226 58 226 102C226 130 200 148 172 148C157 148 146 143 138 134"/>
  </g>
</svg>
